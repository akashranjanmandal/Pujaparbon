# Render Blueprint — one free web service runs the Next.js site and the API together.
# Deploy: Render dashboard → New → Blueprint → pick this GitHub repo.
services:
  - type: web
    name: pujaparbon
    runtime: node
    plan: free
    region: singapore            # closest Render region to India; Turso DB is in Mumbai
    branch: main
    buildCommand: npm ci --include=dev && npm run build --workspace apps/web
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        value: libsql://pujoparbon-pujoparbon.aws-ap-south-1.turso.io
      - key: TURSO_AUTH_TOKEN      # paste the database token in the dashboard (kept secret, not in git)
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_DEMO_MODE # "true" shows the 'simulate location' helper for remote client demos; set "false" for real use
        value: "true"
